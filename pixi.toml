[workspace]
channels = ["conda-forge"]
name = "blackdoc"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "blackdoc"
version = "9999.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
setuptools = ">=82"
setuptools-scm = ">=8"
git = "*"

[package.run-dependencies]
black = ">=25.1"
more-itertools = "*"
tomli = "*"
pathspec = "*"
rich = "*"

[tasks]

[dependencies]
blackdoc = { path = "." }

[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py314.dependencies]
python = "3.14.*"
[feature.py315.dependencies]
python = "3.15.*"

[feature.newest-black.dependencies]
black = ">=26.5"

[feature.tests.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.tests.tasks]
tests = { cmd = "pytest --cov=blackdoc", default-environment = "default", cwd = "." }

[feature.dev.dependencies]
ipython = "*"
pyinstrument = "*"

[feature.dev.target.unix.dependencies]
pdbpp = ">=0.12"

[feature.docs.dependencies]
sphinx = "*"
furo = "*"
ipython = "*"

[feature.docs.tasks]
docs = { cmd = "python -m sphinx -M html -d _build/doctrees -Ea -WT --keep-going -n . _build/html", cwd = "doc" }
docs-rtd = { cmd = "python -m sphinx -M html -d _build/doctrees -Ea -WT --keep-going -n . $READTHEDOCS_OUTPUT/html", cwd = "doc" }

[feature.release.dependencies]
python-build = "*"
twine = "*"

[feature.release.tasks]
build-wheels = { cmd = "python -m build . --outdir dist/", cwd = "." }
check-wheels = { cmd = "twine check dist/*", cwd = "." }

[environments]
default = ["py315", "tests", "dev"]
ci-py311 = ["py311", "tests"]
ci-py312 = ["py312", "tests"]
ci-py314 = ["py314", "tests", "newest-black"]
ci-py315 = ["py315", "tests"]
docs = ["py315", "docs"]
release = { features = ["release"], no-default-feature = true }

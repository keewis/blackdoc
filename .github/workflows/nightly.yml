name: Nightly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # Daily "At 00:00" UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-test-upstream-trigger:
    name: "Detect CI Trigger: [test-upstream]"
    if: |
      github.repository_owner == 'keewis'
      && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@v1.2.1
        id: detect-trigger
        with:
          keyword: "[test-upstream]"

  upstream-dev:
    name: upstream-dev
    runs-on: ubuntu-latest
    needs: detect-test-upstream-trigger

    if: |
      always()
      && github.repository_owner == 'keewis'
      && (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        || needs.detect-test-upstream-trigger.outputs.triggered == 'true'
        || (
            github.event_name == 'pull_request'
            && contains(github.event.pull_request.labels.*.name, 'run-upstream')
        )
      )

    strategy:
      matrix:
        env: ["nightly"]

    env:
      ENV: ${{ matrix.env }}
      MANIFEST_PATH: ci/nightly/pixi.toml

    steps:
      - name: checkout the repository
        uses: actions/checkout@v6.1.0
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags
          persist-credentials: false

      - name: setup environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: "${{ matrix.env }}"
          cache: false
          frozen: false
          manifest-path: ${{ env.MANIFEST_PATH }}

      - name: import and run blackdoc
        run: |
          pixi run --manifest-path $MANIFEST_PATH -e $ENV python -c 'import blackdoc'
          pixi run --manifest-path $MANIFEST_PATH -e $ENV python -m blackdoc

      - name: run tests
        if: success()
        id: tests
        run: |
          pixi run --manifest-path $MANIFEST_PATH -e $ENV tests --report-log=pytest-log.jsonl

      - uses: actions/upload-artifact@v7.0.2
        if: failure() && steps.tests.outcome == 'failure'
        with:
          name: log file
          path: pytest-log.jsonl

  report:
    name: report upstream-dev failures
    runs-on: ubuntu-latest
    needs: tests

    if: |
      needs.tests.result == 'failure'
      && github.event_name == 'schedule'
      && github.repository_owner == 'keewis'

    permissions:
      issues: write # for opening / modifying the reported issues

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: log file
          path: logs/

      - name: Generate and publish a failure report
        if: |
          failure()
          && steps.run-tests.outcome == 'failure'
          && github.event_name == 'schedule'
          && github.repository_owner == 'keewis'
        uses: scientific-python/issue-from-pytest-log-action@v1.6.2
        with:
          log-path: logs/pytest-log.jsonl

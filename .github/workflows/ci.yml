name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-skip-ci-trigger:
    name: "Detect CI Trigger: [skip-ci]"
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@v1.2.1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  unit-tests:
    name: ${{ matrix.os }} ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    needs: detect-skip-ci-trigger
    if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        env: ["ci-py311", "ci-py314", "ci-py315"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    env:
      ENV: ${{ matrix.env }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags
          persist-credentials: false

      - name: setup environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: "${{ matrix.env }}"
          cache: true
          frozen: true

      - name: run tests
        run: |
          pixi run -e $ENV tests

  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        env: ["docs"]

    env:
      ENV: ${{ matrix.env }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: "${{ matrix.env }}"
          cache: true
          frozen: true

      - name: run tests
        run: |
          pixi run -e $ENV docs

  actions-lockfile:
    name: Check actions lockfile
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    name: GHA Security Analysis using Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1

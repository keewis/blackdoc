name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-skip-ci-trigger:
    name: "Detect CI Trigger: [skip-ci]"
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  unit-tests:
    name: ${{ matrix.os }} ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    needs: detect-skip-ci-trigger
    if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

    strategy:
      matrix:
        env: ["ci-py311", "ci-py314", "ci-py315"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    env:
      ENV: ${{ matrix.env }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags
          persist-credentials: false

      - name: setup environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: "${{ matrix.env }}"
          cache: true
          frozen: true

      - name: run tests
        run: |
          pixi run -e $ENV tests

  docs:
    name: Docs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: ["docs"]

    env:
      ENV: ${{ matrix.env }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: setup environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: "${{ matrix.env }}"
          cache: true
          frozen: true

      - name: run tests
        run: |
          pixi run -e $ENV build-docs
